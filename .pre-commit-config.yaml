# Tool configuration lives in pyproject.toml, not here, so editors and a bare
# CLI run pick up the same settings this gate enforces:
#   - ruff    -> [tool.ruff] / [tool.ruff.lint]
#   - pyrefly -> [tool.pyrefly]
# Ruff and pyrefly both discover pyproject.toml on their own, so no --config
# pointer is needed. What stays below is hook plumbing only.
#
# ruff and pyrefly are dev dependencies, so uv.lock owns their versions and the
# local hooks below run the project's copy (`uv run --frozen`, which builds the
# environment from the lock on a fresh clone). They carry no `rev`: a second pin
# would be a second version to keep equal. Hooks for tools that are not project
# dependencies keep their `rev`. Pyrefly's settings live in pyproject.toml
# ([tool.pyrefly]), because without them it silently drops to a lenient preset.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        exclude: ^uv\.lock$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: local
    hooks:
      # Format first, lint second. The other order fails a commit over a line
      # the formatter would have wrapped one hook later — `E501` on a 105-column
      # line that `ruff-format` then rewrapped, reported against a file that was
      # already clean by the time the run ended. An unattended build treats a
      # rejected commit as the end of a unit, so a stale verdict is expensive.
      # The residual case is a `--fix` that leaves something unformatted, which
      # the next run formats; that one is self-healing, and the one above was not.
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        require_serial: true
        types_or: [python, pyi, jupyter]
      # --fix is hook behavior, not lint config: a bare `ruff check` in the
      # editor should report, not rewrite.
      - id: ruff
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        require_serial: true
        types_or: [python, pyi, jupyter]
      - id: pyrefly-check
        name: pyrefly check
        entry: uv run --frozen pyrefly check
        language: system
        pass_filenames: false
        files: ^(src|tests)/
