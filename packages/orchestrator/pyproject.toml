[project]
name = "agent-build-kit-orchestrator"
version = "0.1.0"
description = "The orchestrator of agent-build-kit: the round, the commands a person runs, `abk serve`, the trackers' sync and the notifier"
requires-python = ">=3.12"
dependencies = [
    "agent-build-kit-core",
]

[project.scripts]
abk = "agent_build_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_build_kit"]
# The built web UI is git-ignored, so the wheel is told to carry it (see web/).
artifacts = ["src/agent_build_kit/serve/static"]
