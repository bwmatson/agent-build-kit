[project]
name = "agent-build-kit-worker"
version = "0.1.0"
description = "The worker of agent-build-kit: a unit's graph, the resolution lane, verify and `abk worker`"
requires-python = ">=3.12"
dependencies = [
    "agent-build-kit-core",
]

[project.entry-points."abk.commands"]
worker = "agent_build_kit.cli.worker:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_build_kit"]
