name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scope:
    # Decides from the changed paths whether anything outside the planning
    # paths changed. A skipped job satisfies a required check, which a
    # workflow-level path filter would leave pending.
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: python3 scripts/ci_scope.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

  pre-commit:
    # One zero-tolerance gate: ruff, ruff-format, pyrefly, yamllint. See
    # .pre-commit-config.yaml for what runs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install dev deps
        # Populates .venv from the lock, which the ruff and pyrefly hooks run;
        # --locked fails a lock that pyproject.toml has moved past, instead of
        # re-resolving it to versions a local commit would not run.
        run: uv sync --locked --group dev
      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Run tests
        run: uv run --group dev poe test

  integration:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    # The tests that run the real OpenSpec CLI through npx (pinned in
    # settings.py), so node is needed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Fetch the pinned OpenSpec CLI
        # One retried fetch here, so a failed download is one clear failure
        # before any test. The pin is read from the kit's settings. The limits
        # (300 s per attempt, 20 minutes for the step) are for a slow registry.
        timeout-minutes: 20
        run: >-
          bash .github/scripts/warm-openspec.sh "$(uv run --group dev python -c
          'from agent_build_kit.openspec import PACKAGE;
          from agent_build_kit.settings import settings;
          print(f"{PACKAGE}@{settings.openspec_version}")')"
      - name: Run integration tests
        run: uv run --group dev pytest -m integration
