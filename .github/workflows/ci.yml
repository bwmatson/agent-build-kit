name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    # One zero-tolerance gate: ruff, ruff-format, pyrefly, yamllint. See
    # .pre-commit-config.yaml for what runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dev deps
        # Populates .venv from the lock, which the ruff and pyrefly hooks run;
        # --locked fails a lock that pyproject.toml has moved past, instead of
        # re-resolving it to versions a local commit would not run.
        run: uv sync --locked --group dev
      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Run tests
        run: uv run --group dev poe test

  integration:
    # The tests that run the real OpenSpec CLI through npx (pinned in
    # settings.py), so node is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Run integration tests
        run: uv run --group dev pytest -m integration
