[project]
name = "agent-build-kit"
version = "0.1.0"
description = "Spec-driven, unattended build pipeline for Claude Code across a workspace of repos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.*",
    "langgraph-checkpoint>=4.1.1,<5",
    "langgraph-checkpoint-sqlite==3.1.*",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "githubkit>=0.16.1,<0.17",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
abk = "agent_build_kit.cli:main"
abk-policy-hook = "agent_build_kit.hooks.policy:main"

[project.optional-dependencies]
acp = [
    "agent-client-protocol==0.12.1",
]
telemetry = [
    "opentelemetry-sdk>=1.35",
    "opentelemetry-exporter-otlp-proto-http>=1.35",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "poethepoet>=0.30.0",
    "pyrefly>=1.3.1",
    "pytest>=8.0.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.16",
    "agent-build-kit[acp,telemetry]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_build_kit"]
# The built web UI is git-ignored, so the wheel is told to carry it (see web/).
artifacts = ["src/agent_build_kit/serve/static"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyrefly]
python-version = "3.12"
search-path = ["src", "."]
# Spelled out rather than left to pyrefly's default `**/*.py*` discovery: under
# pre-commit, in a git worktree (which is where every unattended build runs),
# that default is dropped as "matched by project-excludes or an ignore file"
# and the hook then fails with "No Python files matched patterns" — a green
# checkout and a red build for the same commit. An explicit list does not
# depend on that scan.
# Needs pyrefly >= 1.3.1: 1.2.0 still dropped `tests` from this list in a worktree
# under the pipeline's state directory ("Skipping include pattern ... matched by
# `project-excludes` or an ignore file"), so tier 1 passed on a commit whose
# test files CI then failed on.
project-includes = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `from tests.factories import ...` resolves without tests/ being a package
# (test directories carry no __init__.py; basenames stay unique instead).
pythonpath = ["."]
markers = [
    "integration: needs node (npx) and the network for the real OpenSpec CLI; excluded by default, run with `pytest -m integration`",
    "local_stack: drives the real CLI against a real agent on this host, bills on demand and takes minutes; excluded by default, run with `pytest -m local_stack`",
    "serial: cannot share a process with other tests; excluded from the parallel pass and run by its own serial pass of `poe test`",
]
addopts = "-m 'not integration and not local_stack'"

[tool.poe.tasks]
format = { sequence = [
    { cmd = "pre-commit run --all-files" },
    # web/: prettier --check, eslint, tsc and vitest (needs `npm install` in web/ once).
    { ref = "web-check" },
] }
test = { sequence = [
    { cmd = "pytest -n auto --maxprocesses=8 -m 'not serial and not integration and not local_stack'" },
    # Exit 5 is "no tests collected": no test is serial yet, and that is not a failure.
    { cmd = "pytest -m 'serial and not integration and not local_stack'", ignore_fail = [5] },
] }
test-integration = "pytest -m integration"
test-local-stack = "pytest -m local_stack"
scrub = "pytest tests/test_no_installation_leaks.py"
web-check = "npm run --prefix web check"
web-build = "npm run --prefix web build"

[tool.uv.sources]
agent-build-kit = { workspace = true }
