schema: spec-driven

context: |
  This workspace is a set of repos built by an unattended, spec-driven pipeline
  (`abk`). Every change is an OpenSpec change in this planning repo; the
  pipeline turns its task groups into branches and pull requests in the repos
  below.

  Repos:

  **agent-build-kit** — checked out at `.`, GitHub `bwmatson/agent-build-kit`, default branch `main`, languages: python, javascript, typescript.

  Facts about this installation's stack (an agent command, local ports, a home
  variable) belong in the ignored `.env`, read through `from: env-file` entries in
  abk.yaml, never in a committed file. Configuration that is structured and user-specific goes in the
  ignored `abk.local.yaml`, merged over abk.yaml. A planning repo of one repo needs no other
  repo entries.

  Conventions that hold across every repo:

  - Three kinds of test. `unit-test` is the ordinary suite, run on every pull
    request in CI with no external services. `integration-test` covers behaviour
    across modules in the ordinary suite with no live stack; it is not the
    `integration` marker or `tests/integration/`. `e2e-test` needs the real local
    stack and is run serially on one host. A task group says which kind it needs.
  - Tests mirror the source layout: a test lives in the folder matching its
    module's folder under the package root. Integration tests — anything that
    needs a datastore or the stack — live under `tests/integration/`, mirrored
    the same way. A file that mixes marked and unmarked tests is split.
  - A file that moves or is renamed moves with `git mv`, in a commit that does
    nothing else. Git then records a rename rather than a delete beside an add,
    so `git log --follow` and `git blame` still reach the file's history and a
    reviewer can see at a glance that the contents did not change. Editing it
    belongs in a later commit.
  - No test calls a live website. Recording a fixture from one, and replaying
    that recording in a test, is fine — the test names where the recording
    came from.
  - A contract that crosses a repo boundary changes additively first: the
    widening lands alone, every consumer moves, and only then is the old shape
    removed.
  - A new module or interface earns its keep by how much it hides, not how
    little it exposes: prefer one call that does the work over several thin
    ones that mirror the caller's own steps, and don't let one module's
    internal shape (a config's nested fields, an enum's exact members) become
    something a distant caller has to know just to use it.

# abk-rules: v2
#
# Per-artifact rules for the OpenSpec authoring model, rendered by `abk init`
# for this workspace's repos (agent-build-kit). Reword them to suit this
# workspace and add your own — they are prompt input, and yours to own. Keep
# the stamp above: `abk doctor` reads it, not the wording, and reports what
# the framework has added to its rules since that version.
rules:
  proposal:
    - "State which repos the change touches, by their workspace names (agent-build-kit), and what each one gains or loses."
    - "Name the consumer-facing behaviour the change adds or alters; a change with none says so."
  specs:
    - "Write every scenario as GIVEN / WHEN / THEN, and name its test level in the scenario title: unit, integration or acceptance."
    - "Every consumer-facing capability has an acceptance scenario written as the consumer's own steps, not as a description of the implementation."
    - "A drop-in replacement's requirements list the behaviours callers rely on, one requirement each, so the replacement can be checked against them."
    - "A parser names the recorded fixture its tests replay and where that recording came from; no test calls a live website."
  design:
    - "Name the test harness each task group runs under: the runner, the markers, the fakes at protocol boundaries."
    - "Call out every task group whose work crosses a service boundary, and which side lands first."
    - "Name every contract widened by the change and how it is narrowed again once every consumer has moved."
  tasks:
    - "Every task group heading is `## <n>. [<repo>] [<kind>] <title>`, where <repo> is one of [agent-build-kit] and <kind> is `unit-test`, `integration-test` or `e2e-test` (the old spellings are still read, with a notice). Example: `## 1. [agent-build-kit] [unit-test] Add the marker`."
    - "Name the kind of test each group needs, of three: `unit-test` is the ordinary suite, run anywhere; `integration-test` covers behaviour across modules in the ordinary suite with no live stack, and is not the `integration` marker or `tests/integration/`; `e2e-test` needs the real local stack."
    - "The `[acceptance]` tag is for `e2e-test` only; a group of any other kind never carries it."
    - "Number groups from 1 in the order they are built."
    - "Within a group, test tasks come before implementation tasks: the tests are written and committed red first."
    - "A new test file goes where the repo's source layout says: mirroring the source folder, with integration tests under tests/integration/."
    - "A group never spans repos; work in a second repo is a second group with its own tag."
    - "A group that widens a shape another repo consumes carries a third tag `[contract]`, and the change ends with a `[narrow]` group that removes the old half."
    - "The last group is `[e2e-test] [acceptance]`: it drives what the change built the way its consumer does. A change with nothing to drive says so with a line `Acceptance: none — <reason>` instead."
    - "The tags are checked by `abk tags <change>` before the change is committed."
operations:
  apply:
    guidance:
      - "Work only the task group you were asked for; leave the others untouched."
      - "Never remove or rename a shape another repo imports; widen it and leave the narrowing to its own group."
